name: HiBy R1

on:
  push:
    branches: [x1600-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hibyr1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo autoconf automake \
            libtool libtool-bin libgmp-dev libmpfr-dev libmpc-dev libisl-dev libxml2-dev \
            pkg-config python3-lxml zip unzip

      - name: Cache MIPS toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mipsel-elf
          key: mipsel-elf-ubuntu24-x64-${{ hashFiles('tools/rockboxdev.sh', 'tools/toolchain-patches/**') }}

      - name: Build MIPS toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          bash tools/rockboxdev.sh --target=i --prefix="$RUNNER_TEMP/mipsel-elf" \
            --dlwhere="$RUNNER_TEMP/rbdev-download" --builddir="$RUNNER_TEMP/rbdev-build"
          rm -rf "$RUNNER_TEMP/rbdev-build" "$RUNNER_TEMP/rbdev-download"

      - name: Build firmware and bootloader
        run: |
          export PATH="$RUNNER_TEMP/mipsel-elf/bin:$PATH"
          mipsel-elf-gcc --version
          bash .github/scripts/build-hibyr1.sh "$RUNNER_TEMP/r1-build" "$RUNNER_TEMP/r1-output"

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hibyr1-firmware
          path: ${{ runner.temp }}/r1-output/firmware/
          if-no-files-found: error
          retention-days: 1

      - name: Upload debugging symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hibyr1-symbols
          path: ${{ runner.temp }}/r1-output/symbols/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pkg-config
        if: runner.os == 'macOS'
        run: brew install pkgconf

      - name: Download firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hibyr1-firmware
          path: ${{ runner.temp }}/r1-package

      - name: Build jztool
        run: bash .github/scripts/build-jztool.sh "$RUNNER_TEMP/jztool-build" "$RUNNER_TEMP/r1-package"

      - name: Package files
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd "$RUNNER_TEMP/r1-package"
          shasum -a 256 ./* > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/hibyr1-$PLATFORM.tar.gz" .
          echo "Download **hibyr1-$PLATFORM** for firmware, bootloader, jztool and instructions." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload install package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hibyr1-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
